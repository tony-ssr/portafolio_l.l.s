<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <defs>
    <filter id="chococat-audio-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#211E1D" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g id="chococat-audio-char" filter="url(#chococat-audio-shadow)">
    <!-- Ears -->
    <path d="M 66 65 L 50 16 C 50 12 56 10 62 14 L 94 45 Z" fill="#211E1D"/>
    <path d="M 67 55 L 58 23 C 58 21 61 20 64 22 L 86 44 Z" fill="#FEEFD8"/>
    <path d="M 174 65 L 190 16 C 190 12 184 10 178 14 L 146 45 Z" fill="#211E1D"/>
    <path d="M 173 55 L 182 23 C 182 21 179 20 176 22 L 154 44 Z" fill="#FEEFD8"/>
    
    <!-- Body -->
    <ellipse cx="120" cy="155" rx="46" ry="34" fill="#211E1D"/>
    
    <!-- Head -->
    <ellipse cx="120" cy="92" rx="62" ry="52" fill="#211E1D"/>
    
    <!-- Whiskers -->
    <line x1="64" y1="84" x2="26" y2="76" stroke="#211E1D" stroke-width="3" stroke-linecap="round"/>
    <circle cx="26" cy="76" r="2.5" fill="#211E1D"/>
    <line x1="62" y1="94" x2="22" y2="94" stroke="#211E1D" stroke-width="3" stroke-linecap="round"/>
    <circle cx="22" cy="94" r="2.5" fill="#211E1D"/>
    <line x1="64" y1="104" x2="26" y2="112" stroke="#211E1D" stroke-width="3" stroke-linecap="round"/>
    <circle cx="26" cy="112" r="2.5" fill="#211E1D"/>
    
    <line x1="176" y1="84" x2="214" y2="76" stroke="#211E1D" stroke-width="3" stroke-linecap="round"/>
    <circle cx="214" cy="76" r="2.5" fill="#211E1D"/>
    <line x1="178" y1="94" x2="218" y2="94" stroke="#211E1D" stroke-width="3" stroke-linecap="round"/>
    <circle cx="218" cy="94" r="2.5" fill="#211E1D"/>
    <line x1="176" y1="104" x2="214" y2="112" stroke="#211E1D" stroke-width="3" stroke-linecap="round"/>
    <circle cx="214" cy="112" r="2.5" fill="#211E1D"/>
    
    <!-- Eyes - Joyful listening -->
    <ellipse cx="94" cy="91" rx="15" ry="19" fill="#FFFFFF"/>
    <ellipse cx="146" cy="91" rx="15" ry="19" fill="#FFFFFF"/>
    <ellipse cx="94" cy="92" rx="8" ry="11" fill="#211E1D"/>
    <ellipse cx="146" cy="92" rx="8" ry="11" fill="#211E1D"/>
    <circle cx="92" cy="88" r="3" fill="#FFFFFF"/>
    <circle cx="144" cy="88" r="3" fill="#FFFFFF"/>
    
    <!-- Nose -->
    <ellipse cx="120" cy="102" rx="5" ry="3.5" fill="#58311B"/>
    
    <!-- Collar & Bell -->
    <rect x="88" y="136" width="64" height="10" rx="5" fill="#4DA3D9"/>
    <circle cx="120" cy="146" r="7" fill="#F7CA44"/>
    <circle cx="120" cy="145.5" r="1.8" fill="#58311B"/>
    
    <!-- Paws -->
    <ellipse cx="88" cy="170" rx="10" ry="8" fill="#211E1D"/>
    <ellipse cx="152" cy="170" rx="10" ry="8" fill="#211E1D"/>
    
    <!-- Headphones Headband -->
    <path d="M 62 88 A 66 66 0 0 1 178 88" fill="none" stroke="#4DA3D9" stroke-width="6" stroke-linecap="round"/>
    <!-- Left Ear Cup -->
    <rect x="52" y="74" width="16" height="34" rx="8" fill="#58B4EC" stroke="#2E79B5" stroke-width="2"/>
    <rect x="62" y="78" width="6" height="26" rx="3" fill="#FFFDF9"/>
    <!-- Right Ear Cup -->
    <rect x="172" y="74" width="16" height="34" rx="8" fill="#58B4EC" stroke="#2E79B5" stroke-width="2"/>
    <rect x="172" y="78" width="6" height="26" rx="3" fill="#FFFDF9"/>
    
    <!-- Floating Musical Notes -->
    <g fill="#F7CA44" transform="translate(186, 30) scale(0.85)">
      <circle cx="10" cy="20" r="4.5"/>
      <circle cx="26" cy="16" r="4.5"/>
      <line x1="14" y1="20" x2="14" y2="6" stroke="#F7CA44" stroke-width="2.5"/>
      <line x1="30" y1="16" x2="30" y2="2" stroke="#F7CA44" stroke-width="2.5"/>
      <polygon points="14,6 30,2 30,6 14,10"/>
    </g>
    <g fill="#4DA3D9" transform="translate(32, 38) scale(0.7)">
      <circle cx="10" cy="20" r="4.5"/>
      <line x1="14" y1="20" x2="14" y2="4" stroke="#4DA3D9" stroke-width="2.5"/>
      <path d="M 14 4 Q 22 2 24 10" fill="none" stroke="#4DA3D9" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>