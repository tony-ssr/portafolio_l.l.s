<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%">
  <defs>
    <filter id="chococat-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#211E1D" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g id="chococat-character" filter="url(#chococat-shadow)">
    <!-- Left Ear -->
    <path d="M 46 72 L 32 20 C 32 16 38 14 44 18 L 78 50 Z" fill="#211E1D"/>
    <path d="M 47 62 L 38 27 C 38 25 41 24 44 26 L 68 49 Z" fill="#FEEFD8"/>
    
    <!-- Right Ear -->
    <path d="M 154 72 L 168 20 C 168 16 162 14 156 18 L 122 50 Z" fill="#211E1D"/>
    <path d="M 153 62 L 162 27 C 162 25 159 24 156 26 L 132 49 Z" fill="#FEEFD8"/>
    
    <!-- Head Base -->
    <ellipse cx="100" cy="94" rx="66" ry="56" fill="#211E1D"/>
    
    <!-- Whiskers Left (3 horizontal antenna with round tips) -->
    <line x1="40" y1="83" x2="3" y2="74" stroke="#211E1D" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="3" cy="74" r="2.8" fill="#211E1D"/>
    
    <line x1="37" y1="94" x2="0" y2="94" stroke="#211E1D" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="94" r="2.8" fill="#211E1D"/>
    
    <line x1="40" y1="105" x2="3" y2="114" stroke="#211E1D" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="3" cy="114" r="2.8" fill="#211E1D"/>
    
    <!-- Whiskers Right (3 horizontal antenna with round tips) -->
    <line x1="160" y1="83" x2="197" y2="74" stroke="#211E1D" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="197" cy="74" r="2.8" fill="#211E1D"/>
    
    <line x1="163" y1="94" x2="200" y2="94" stroke="#211E1D" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="200" cy="94" r="2.8" fill="#211E1D"/>
    
    <line x1="160" y1="105" x2="197" y2="114" stroke="#211E1D" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="197" cy="114" r="2.8" fill="#211E1D"/>
    
    <!-- Big Expressive White Eyes -->
    <ellipse cx="73" cy="93" rx="16.5" ry="21" fill="#FFFFFF"/>
    <ellipse cx="127" cy="93" rx="16.5" ry="21" fill="#FFFFFF"/>
    
    <!-- Large Pupils -->
    <ellipse cx="73" cy="94" rx="9" ry="12.5" fill="#211E1D"/>
    <ellipse cx="127" cy="94" rx="9" ry="12.5" fill="#211E1D"/>
    
    <!-- Soft Eye Reflection Sparkle -->
    <circle cx="70" cy="89" r="3.2" fill="#FFFFFF"/>
    <circle cx="124" cy="89" r="3.2" fill="#FFFFFF"/>
    
    <!-- Chocolate Brown Nose -->
    <ellipse cx="100" cy="105" rx="5.5" ry="4" fill="#58311B"/>
    
    <!-- Blue Collar -->
    <rect x="66" y="142" width="68" height="11" rx="5.5" fill="#4DA3D9"/>
    <!-- Yellow Bell -->
    <circle cx="100" cy="153" r="7.5" fill="#F7CA44"/>
    <circle cx="100" cy="152.5" r="1.8" fill="#58311B"/>
    <line x1="100" y1="154.3" x2="100" y2="158" stroke="#58311B" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>